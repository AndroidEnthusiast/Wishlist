<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Wishlist</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="description" content="Open the list and tap Reserve on a gift so nobody doubles up.">
<meta property="og:type" content="website">
<meta property="og:title" content="Check out my wishes 🎁">
<meta property="og:description" content="Open the list and tap Reserve on a gift so nobody doubles up.">
<meta property="og:image" content="https://androidenthusiast.github.io/Wishlist/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Check out my wishes 🎁">
<meta name="twitter:description" content="Open the list and tap Reserve on a gift so nobody doubles up.">
<meta name="twitter:image" content="https://androidenthusiast.github.io/Wishlist/og.png">
<style>
  :root {
    --bg: #fbf8ff; --fg: #1b1b21; --muted: #46464f; --card: #f0edf7;
    --primary: #4355b9; --on-primary: #ffffff; --container: #dee0ff; --on-container: #00105c;
    --outline: #777680; --green: #0b7a3e; --error: #ba1a1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121318; --fg: #e4e1e9; --muted: #c7c5d0; --card: #1f1f25;
      --primary: #bac3ff; --on-primary: #08218a; --container: #2c3fa0; --on-container: #dee0ff;
      --outline: #91909a; --error: #ffb4ab;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: "Google Sans", "Product Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4; -webkit-text-size-adjust: 100%;
  }
  header { padding: 20px 16px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; font-weight: 500; overflow-wrap: anywhere; }
  .sub { margin: 0; color: var(--muted); font-size: .95rem; }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 48px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--outline); background: transparent; color: var(--fg);
    border-radius: 8px; padding: 6px 14px; font: inherit; font-size: .9rem; cursor: pointer;
  }
  .chip.on { background: var(--container); color: var(--on-container); border-color: transparent; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .card { background: var(--card); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; }
  .card.dim .body, .card.dim .pic img { opacity: .6; }
  .pic {
    position: relative; display: flex; align-items: center; justify-content: center; height: 170px;
    background: #fff; text-decoration: none;
  }
  .pic.empty { background: var(--container); font-size: 3rem; }
  .pic img { max-width: 100%; max-height: 100%; padding: 8px; object-fit: contain; }
  .badge {
    position: absolute; top: 12px; padding: 4px 10px; border-radius: 8px; font-size: .8rem; font-weight: 500;
  }
  .badge.drop { left: 12px; background: var(--green); color: #fff; }
  .badge.status { right: 12px; background: var(--bg); color: var(--fg); }
  .body { padding: 16px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .meta { color: var(--muted); font-size: .8rem; }
  .title {
    font-size: 1.05rem; font-weight: 500; margin: 0; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .desc {
    color: var(--muted); font-size: .9rem; margin: 0; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 10px; }
  .price { font-size: 1.3rem; font-weight: 600; }
  .price.drop { color: var(--green); }
  .old { color: var(--muted); text-decoration: line-through; font-size: .9rem; margin-left: 8px; font-weight: 400; }
  .store { color: var(--primary); font-size: .85rem; text-decoration: none; }
  button.act {
    font: inherit; font-weight: 500; border-radius: 20px; padding: 9px 20px; cursor: pointer;
    border: 1px solid transparent; background: var(--primary); color: var(--on-primary);
  }
  button.act.outline { background: transparent; color: var(--primary); border-color: var(--outline); }
  button.act:disabled { opacity: .5; cursor: default; }
  .note { color: var(--muted); font-size: .8rem; text-align: center; padding: 28px 8px 0; }
  .center { text-align: center; padding: 56px 16px; color: var(--muted); }
  .center button { margin-top: 12px; }
  form.code { display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  form.code input {
    font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--outline);
    background: transparent; color: var(--fg); text-transform: uppercase; width: 14em; max-width: 100%;
  }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg); color: var(--bg);
    padding: 12px 18px; border-radius: 10px; font-size: .9rem; max-width: calc(100% - 32px);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1 id="name">Wishlist</h1>
  <p class="sub" id="sub"></p>
</header>
<main>
  <div id="chips" class="chips" hidden></div>
  <div id="view"><div class="center">Loading…</div></div>
  <p class="note" id="note" hidden>Tap Reserve on a gift you plan to buy so nobody doubles up. The list owner can’t see what’s reserved.</p>
</main>
<div id="toast" role="status"></div>

<script>
"use strict";
var SUPABASE_URL = "https://aspnmvmsvwbezdltykgx.supabase.co";
var SUPABASE_KEY = "sb_publishable_2RpbWlDJBB3yV2TO-h68xA_i-gXfd_t";

var CODE_RE = /^[A-HJ-NP-Z2-9]{8}$/;
var $ = function (id) { return document.getElementById(id); };

var code = null, list = null, res = {}, cat = "All", busy = false, state = "loading", memDevice = null;

function deviceId() {
  try {
    var d = localStorage.getItem("wl_device");
    if (!d) {
      d = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : "d" + Date.now().toString(36) + Math.random().toString(36).slice(2);
      localStorage.setItem("wl_device", d);
    }
    return d;
  } catch (e) {
    if (!memDevice) memDevice = "m" + Date.now().toString(36) + Math.random().toString(36).slice(2);
    return memDevice;
  }
}

function parseCode(s) {
  s = String(s || "").toUpperCase();
  var m = /WL-([A-Z0-9]{8})/.exec(s);
  var c = m ? m[1] : s.replace(/[^A-Z0-9]/g, "");
  if (c.indexOf("WL") === 0 && c.length === 10) c = c.slice(2);
  return CODE_RE.test(c) ? c : null;
}

function readCode() {
  var q = new URLSearchParams(location.search);
  var raw = q.get("c") || q.get("code") || location.hash.replace(/^#/, "");
  return parseCode(raw);
}

async function rpc(fn, body) {
  var h = { "Content-Type": "application/json", "apikey": SUPABASE_KEY };
  if (SUPABASE_KEY.indexOf("eyJ") === 0) h["Authorization"] = "Bearer " + SUPABASE_KEY;
  var r = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, { method: "POST", headers: h, body: JSON.stringify(body) });
  var t = await r.text();
  if (!r.ok) throw new Error("Server said " + r.status);
  return t ? JSON.parse(t) : null;
}

function safeUrl(u) {
  try {
    var x = new URL(u);
    return (x.protocol === "http:" || x.protocol === "https:") ? x.href : "";
  } catch (e) { return ""; }
}

function hostOf(u) {
  try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; }
}

function money(p, cur) {
  try { return new Intl.NumberFormat(undefined, { style: "currency", currency: cur || "USD" }).format(p); }
  catch (e) { return Number(p).toFixed(2); }
}

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

var toastTimer = null;
function toast(msg) {
  var t = $("toast");
  t.textContent = msg;
  t.className = "show";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.className = ""; }, 3500);
}

function showCodeForm(msg) {
  var v = $("view");
  v.textContent = "";
  var box = el("div", "center");
  box.appendChild(el("p", null, msg));
  var f = el("form", "code");
  var i = el("input");
  i.placeholder = "Enter list code";
  i.setAttribute("aria-label", "List code");
  i.autocapitalize = "characters";
  var b = el("button", "act", "Open");
  b.type = "submit";
  f.appendChild(i); f.appendChild(b);
  f.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var c = parseCode(i.value);
    if (!c) { toast("That doesn’t look like a list code."); return; }
    location.search = "?c=" + c;
  });
  box.appendChild(f);
  v.appendChild(box);
  $("chips").hidden = true;
  $("note").hidden = true;
}

function renderChips() {
  var box = $("chips");
  box.textContent = "";
  var cats = (list && list.cats) || [];
  if (!cats.length) { box.hidden = true; return; }
  if (cat !== "All" && cats.indexOf(cat) < 0) cat = "All";
  box.hidden = false;
  ["All"].concat(cats).forEach(function (c) {
    var b = el("button", "chip" + (c === cat ? " on" : ""), c);
    b.type = "button";
    b.addEventListener("click", function () { cat = c; render(); });
    box.appendChild(b);
  });
}

function card(w) {
  var r = res[w.id];
  var got = !!w.got;
  var dim = got || r === false;
  var c = el("div", "card" + (dim ? " dim" : ""));

  var link = safeUrl(w.url);
  var pic = el(link ? "a" : "div", "pic" + (w.image && safeUrl(w.image) ? "" : " empty"));
  if (link) { pic.href = link; pic.target = "_blank"; pic.rel = "noopener noreferrer"; }
  var img = safeUrl(w.image);
  if (img) {
    var im = el("img");
    im.src = img; im.alt = w.title || ""; im.loading = "lazy"; im.referrerPolicy = "no-referrer";
    im.addEventListener("error", function () { im.remove(); pic.classList.add("empty"); pic.appendChild(el("span", null, "🎁")); });
    pic.appendChild(im);
  } else {
    pic.appendChild(el("span", null, "🎁"));
  }
  var drop = typeof w.price === "number" && typeof w.old === "number" && w.old > w.price;
  if (drop) pic.appendChild(el("span", "badge drop", "↓ " + Math.round((1 - w.price / w.old) * 100) + "% off"));
  var status = got ? "Got it" : r === true ? "Reserved by you" : r === false ? "Reserved" : "";
  if (status) pic.appendChild(el("span", "badge status", status));
  c.appendChild(pic);

  var body = el("div", "body");
  var meta = hostOf(w.url) + (w.cat ? " · " + w.cat : "");
  body.appendChild(el("div", "meta", meta));
  body.appendChild(el("h2", "title", w.title || ""));
  if (w.desc) body.appendChild(el("p", "desc", w.desc));

  var row = el("div", "row");
  var pr = el("div", "price" + (drop ? " drop" : ""), typeof w.price === "number" ? money(w.price, w.cur) : "No price");
  if (drop) pr.appendChild(el("span", "old", money(w.old, w.cur)));
  row.appendChild(pr);

  if (!got) {
    if (r === undefined) {
      var b = el("button", "act", "Reserve");
      b.type = "button"; b.disabled = busy;
      b.addEventListener("click", function () { toggle(w, true); });
      row.appendChild(b);
    } else if (r === true) {
      var u = el("button", "act outline", "Undo");
      u.type = "button"; u.disabled = busy;
      u.addEventListener("click", function () { toggle(w, false); });
      row.appendChild(u);
    }
  }
  body.appendChild(row);

  if (link) {
    var a = el("a", "store", "View in store ↗");
    a.href = link; a.target = "_blank"; a.rel = "noopener noreferrer";
    body.appendChild(a);
  }
  c.appendChild(body);
  return c;
}

function render() {
  var v = $("view");
  if (state === "gone") { showCodeForm("This list isn’t shared anymore."); return; }
  if (state === "offline" && !list) {
    v.textContent = "";
    var box = el("div", "center");
    box.appendChild(el("p", null, "Couldn’t load the list. Check your connection."));
    var b = el("button", "act", "Try again");
    b.type = "button";
    b.addEventListener("click", function () { state = "loading"; refresh(); });
    box.appendChild(b);
    v.appendChild(box);
    $("chips").hidden = true;
    return;
  }
  if (!list) { v.textContent = ""; v.appendChild(el("div", "center", "Loading…")); return; }

  $("name").textContent = list.name || "Wishlist";
  document.title = list.name || "Wishlist";
  $("sub").textContent = "Reserve a gift so nobody doubles up.";
  renderChips();
  var shown = (list.items || []).filter(function (w) { return cat === "All" || w.cat === cat; });
  v.textContent = "";
  if (!shown.length) {
    v.appendChild(el("div", "center", "Nothing here yet."));
  } else {
    var g = el("div", "grid");
    shown.forEach(function (w) { g.appendChild(card(w)); });
    v.appendChild(g);
  }
  $("note").hidden = false;
}

async function refresh() {
  if (!code || busy) return;
  try {
    var l = await rpc("wl_get_list", { p_code: code });
    if (l === null) { state = "gone"; list = null; render(); return; }
    var rs = await rpc("wl_get_reservations", { p_code: code, p_device: deviceId() });
    var m = {};
    (rs || []).forEach(function (x) { m[x.id] = x.mine; });
    list = l; res = m; state = "ok";
  } catch (e) {
    if (!list) state = "offline";
  }
  render();
}

async function toggle(w, reserve) {
  busy = true; render();
  var msg = null;
  try {
    if (reserve) {
      var ok = await rpc("wl_reserve_item", { p_code: code, p_item: w.id, p_device: deviceId() });
      if (ok !== true) msg = "Someone else just reserved that one.";
    } else {
      await rpc("wl_unreserve_item", { p_code: code, p_item: w.id, p_device: deviceId() });
    }
    busy = false;
    await refresh();
  } catch (e) {
    busy = false;
    msg = "No connection. Try again.";
    render();
  }
  if (msg) toast(msg);
}

code = readCode();
if (!code) {
  showCodeForm("Open the link your friend sent you, or enter their list code.");
} else {
  refresh();
  setInterval(function () { if (!document.hidden) refresh(); }, 20000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
}
</script>
</body>
</html>
