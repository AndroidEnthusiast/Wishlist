name: Server scripts check
# Every day (owner, 18 November 2026; docs/MAP.md "Server script versions"): asks the live server, read-only with the
# public key, which version of each supabase-*.sql script it has, and compares with the project. When the server is
# behind, the job fails and opens (or updates) the GitHub issue "Server scripts to run", listing each script with a
# link, in the order to run them, so the owner gets an e-mail. Free on GitHub; no Claude tokens.
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare the server with the project
        run: node tests/sql/stamps.js --server
      - name: Tell the owner (a GitHub issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Server scripts to run';
            const body = fs.existsSync('server-behind.md') ? fs.readFileSync('server-behind.md', 'utf8') : 'The server check failed: see the run.';
            const full = body + `\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const same = open.data.find(i => i.title === title && !i.pull_request);
            if (same) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: same.number, body: full });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body: full });
      - name: Close the issue once the server has caught up
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            for (const i of open.data.filter(i => i.title === 'Server scripts to run' && !i.pull_request))
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number, state: 'closed', state_reason: 'completed' });
