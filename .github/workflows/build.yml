name: Build APK and publish page
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zip
        run: |
          if [ -f wishlist-android.zip ]; then unzip -q -o wishlist-android.zip; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      # The signing key is a repository secret, never a file in the project (Settings > Secrets and variables > Actions).
      - name: Put the signing key in place
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::The secret KEYSTORE_BASE64 is missing. Add the signing key under Settings > Secrets and variables > Actions."; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      # The app's own checks (app/src/test, plain JUnit) run first; if one fails, no APK is made and the download
      # link keeps the previous app (ROADMAP S0.1). The screenshot tests are left out (owner, 5 November 2026).
      - name: Check the app and build release APK
        env:
          WISHLIST_KEYSTORE: ${{ runner.temp }}/release.jks
          WISHLIST_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WISHLIST_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace
      - name: Keep the test report when a check failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: wishlist-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Wishlist.apk
          gh release delete latest --cleanup-tag --yes || true
          # If GitHub couldn't delete the old release (it answered "HTTP 500" on 5 November 2026), the new APK replaces
          # the old file in it instead, so the download link always gives the newest app.
          gh release create latest Wishlist.apk --title "Latest Wishlist app" --notes "Newest build. Download Wishlist.apk below." --target "${{ github.sha }}" \
            || gh release upload latest Wishlist.apk --clobber
          # "gh release create" makes a draft, uploads the file and then publishes it. When GitHub stumbled on that last
          # part (8 November 2026), the release stayed a draft and the download link gave "404". So: publish it again,
          # and stop with a red cross if it still isn't public, instead of a green tick nobody can download.
          gh release edit latest --draft=false --latest || true
          test "$(gh release view latest --json isDraft --jq .isDraft)" = "false"

  # The checks of the web pages and the helper functions (tests/run-all.sh), on GitHub too (owner, 10 November 2026):
  # the web pages are only published when they pass, so a broken page can't go live because a session skipped them.
  # A suite that fails is tried once more (one browser check fails now and then without a cause). The three suites
  # that need a PostgreSQL, and the database checks of tests/sql, run against a throw-away one (R5, 10 November 2026).
  web-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get the test tools
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      # A throw-away PostgreSQL (the one GitHub's computer already has), so the database checks and the page suites
      # that need the real supabase-*.sql scripts run here too (ROADMAP R5). Never the real Supabase.
      - name: Start a throw-away PostgreSQL
        run: |
          bin=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)
          mkdir -p "$RUNNER_TEMP/pg"
          "$bin/initdb" -D "$RUNNER_TEMP/pg/data" -U postgres -A trust > /dev/null
          "$bin/pg_ctl" -D "$RUNNER_TEMP/pg/data" -o "-p 5499 -k $RUNNER_TEMP/pg -c listen_addresses=''" -l "$RUNNER_TEMP/pg/log" -w start
          echo "WL_PG=-h $RUNNER_TEMP/pg -p 5499 -U postgres" >> "$GITHUB_ENV"
      - name: Check the web pages, the helper functions and the database scripts
        working-directory: tests
        run: |
          bash run-all.sh || { echo "::warning::A web check failed; trying all of them once more."; bash run-all.sh; }

  pages:
    needs: web-checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: app.json needs the moment the version number last changed.
          fetch-depth: 0
      - name: Unpack project zip
        run: |
          if [ -f wishlist-android.zip ]; then unzip -q -o wishlist-android.zip; fi
      - name: Look for the web page files
        id: web
        run: |
          if [ -f web/index.html ]; then echo "found=yes" >> "$GITHUB_OUTPUT"; else echo "found=no" >> "$GITHUB_OUTPUT"; fi
      # Every release gets its own "?v=..." on the scripts and styles, so browsers fetch the new files instead of
      # mixing an old saved copy with the new page.
      - name: Make browsers load the new files
        if: steps.web.outputs.found == 'yes'
        run: |
          v="${GITHUB_SHA:0:7}"
          sed -i "s/?v=dev\"/?v=$v\"/g" web/*.html
          grep -c "?v=$v" web/index.html web/edit.html
      # What the app is told about itself (AppInfo.kt, ROADMAP R6): the newest version and since when, from the
      # app's build file; "min" (the oldest version that still works) and "notice" are set by hand in web/app.json.
      - name: Write app.json for the update notice
        if: steps.web.outputs.found == 'yes'
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          g = open("app/build.gradle.kts").read()
          code = int(re.search(r"versionCode\s*=\s*(\d+)", g).group(1))
          name = re.search(r'versionName\s*=\s*"([^"]+)"', g).group(1)
          # Since when this version is out: the commit that last changed the version number.
          since = int(subprocess.check_output(["git", "log", "-1", "--format=%ct", "-G", "versionCode", "--", "app/build.gradle.kts"]).decode().strip() or 0)
          o = json.load(open("web/app.json"))
          m = int(o.get("min", 0))
          assert 0 <= m <= code, "web/app.json: min (%d) is newer than the app itself (%d): that would lock everyone out" % (m, code)
          assert since > 0, "couldn't find when the version changed"
          out = {"latest": code, "name": name, "since": since, "min": m, "notice": str(o.get("notice", ""))[:300]}
          json.dump(out, open("web/app.json", "w"))
          print(out)
          PY
      - name: Package the web page
        if: steps.web.outputs.found == 'yes'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publish the web page
        id: deployment
        if: steps.web.outputs.found == 'yes'
        uses: actions/deploy-pages@v4
        with:
          # GitHub sometimes needs more than the default 10 minutes to publish (4 November 2026: three timeouts).
          timeout: 1800000
