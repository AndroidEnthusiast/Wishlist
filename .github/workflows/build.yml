name: Build APK and publish page
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zip
        run: |
          if [ -f wishlist-android.zip ]; then unzip -q -o wishlist-android.zip; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: wishlist-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # main -> release "latest" (the link friends use). Any other branch -> release "test" (for trying changes first).
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Wishlist.apk
          if [ "${{ github.ref_name }}" = "main" ]; then
            gh release delete latest --cleanup-tag --yes || true
            gh release create latest Wishlist.apk --latest --title "Latest Wishlist app" --notes "Newest build. Download Wishlist.apk below." --target "${{ github.sha }}"
          else
            gh release delete test --cleanup-tag --yes || true
            gh release create test Wishlist.apk --prerelease --title "Test version (not for friends)" --notes "Test build from branch ${{ github.ref_name }}. Installing it replaces the Wishlist app on your phone; your wishes stay." --target "${{ github.sha }}"
          fi

  pages:
    # The web page is only published from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zip
        run: |
          if [ -f wishlist-android.zip ]; then unzip -q -o wishlist-android.zip; fi
      - name: Look for the web page files
        id: web
        run: |
          if [ -f web/index.html ]; then echo "found=yes" >> "$GITHUB_OUTPUT"; else echo "found=no" >> "$GITHUB_OUTPUT"; fi
      - name: Package the web page
        if: steps.web.outputs.found == 'yes'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publish the web page
        id: deployment
        if: steps.web.outputs.found == 'yes'
        uses: actions/deploy-pages@v4
