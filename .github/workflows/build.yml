name: Build APK and publish page
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zip
        run: |
          if [ -f wishlist-android.zip ]; then unzip -q -o wishlist-android.zip; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # The signing key is a repository secret, never a file in the project (Settings > Secrets and variables > Actions).
      - name: Put the signing key in place
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::The secret KEYSTORE_BASE64 is missing. Add the signing key under Settings > Secrets and variables > Actions."; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      # The app's own checks (app/src/test, plain JUnit) run first; if one fails, no APK is made and the download
      # link keeps the previous app (ROADMAP S0.1). The screenshot tests are left out (owner, 5 November 2026).
      - name: Check the app and build release APK
        env:
          WISHLIST_KEYSTORE: ${{ runner.temp }}/release.jks
          WISHLIST_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WISHLIST_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace
      - name: Keep the test report when a check failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: wishlist-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Wishlist.apk
          gh release delete latest --cleanup-tag --yes || true
          # If GitHub couldn't delete the old release (it answered "HTTP 500" on 5 November 2026), the new APK replaces
          # the old file in it instead, so the download link always gives the newest app.
          gh release create latest Wishlist.apk --title "Latest Wishlist app" --notes "Newest build. Download Wishlist.apk below." --target "${{ github.sha }}" \
            || gh release upload latest Wishlist.apk --clobber

  pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zip
        run: |
          if [ -f wishlist-android.zip ]; then unzip -q -o wishlist-android.zip; fi
      - name: Look for the web page files
        id: web
        run: |
          if [ -f web/index.html ]; then echo "found=yes" >> "$GITHUB_OUTPUT"; else echo "found=no" >> "$GITHUB_OUTPUT"; fi
      # Every release gets its own "?v=..." on the scripts and styles, so browsers fetch the new files instead of
      # mixing an old saved copy with the new page.
      - name: Make browsers load the new files
        if: steps.web.outputs.found == 'yes'
        run: |
          v="${GITHUB_SHA:0:7}"
          sed -i "s/?v=dev\"/?v=$v\"/g" web/*.html
          grep -c "?v=$v" web/index.html web/edit.html
      - name: Package the web page
        if: steps.web.outputs.found == 'yes'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publish the web page
        id: deployment
        if: steps.web.outputs.found == 'yes'
        uses: actions/deploy-pages@v4
        with:
          # GitHub sometimes needs more than the default 10 minutes to publish (4 November 2026: three timeouts).
          timeout: 1800000
