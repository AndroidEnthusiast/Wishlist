name: Weekly database backup
# The weekly copy of the Wishlist database (owner, D3, 8 November 2026), in this PRIVATE repository since
# 11 November 2026 (ROADMAP R3): its files can only be downloaded by the owner. What it does, every week:
#  1. copies the "public" part of the Supabase database (lists, wishes, reservations, friends, groups, exchanges,
#     encrypted chats) and counts the rows of every table;
#  2. copies every picture in Supabase Storage's public buckets (wish photos and covers);
#  3. restores the copy into a throw-away database and checks every table has the same number of rows (a copy that
#     can't be restored is no copy);
#  4. locks database and pictures together with BACKUP_PASSWORD (AES-256) and keeps them 60 days.
# Secrets (Settings > Secrets and variables > Actions): SUPABASE_DB_URL (Supabase > Connect > Session pooler, with the
# database password) and BACKUP_PASSWORD (at least 16 characters, kept in the owner's password manager).
# Restoring: the Wishlist repository's docs/BACKUPS.md.
on:
  schedule:
    - cron: '43 2 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      # Rows per table of the "public" part, one line each, sorted: the same question on the database and on the copy.
      COUNT_SQL: >-
        select string_agg(t || ' ' || n, E'\n' order by t) from (select c.relname as t,
        (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from public.%I', c.relname), false, true, '')))[1]::text as n
        from pg_class c join pg_namespace s on s.oid = c.relnamespace where s.nspname = 'public' and c.relkind = 'r') x
    steps:
      - name: Check the secrets are there
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PW: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          [ -n "$DB" ] || { echo "::error::The secret SUPABASE_DB_URL is missing (Settings > Secrets and variables > Actions)."; exit 1; }
          [ -n "$PW" ] || { echo "::error::The secret BACKUP_PASSWORD is missing (Settings > Secrets and variables > Actions)."; exit 1; }
          [ ${#PW} -ge 16 ] || { echo "::error::BACKUP_PASSWORD is too short: use at least 16 characters."; exit 1; }
      - name: Copy the database
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # The connection string is split into its parts here and handed over as PGHOST, PGPASSWORD and so on, never
          # as one text: a password with % or $ in it once made the database tool print part of it into this public
          # log (8 November 2026). The password is masked as well, and nothing below echoes it.
          python3 - > pg.env <<'PY'
          import os, re, urllib.parse
          u = os.environ["DB"].strip()
          u = re.sub(r"^postgres(ql)?://", "", u)
          userinfo, hostpart = u.rsplit("@", 1)
          user, pw = userinfo.split(":", 1)
          pw = pw.strip("[]") if pw.startswith("[") and pw.endswith("]") else pw
          if re.fullmatch(r"(?:[^%]|%[0-9A-Fa-f]{2})*", pw): pw = urllib.parse.unquote(pw)
          hostport, _, db = hostpart.partition("/")
          host, _, port = hostport.partition(":")
          db = db.split("?", 1)[0] or "postgres"
          print("::add-mask::" + pw)
          for k, v in (("PGHOST", host), ("PGPORT", port or "5432"), ("PGUSER", urllib.parse.unquote(user)), ("PGDATABASE", db), ("PGPASSWORD", pw)):
              print(k + "=" + v)
          PY
          grep '^::add-mask::' pg.env || true
          grep -v '^::add-mask::' pg.env > pg.list; rm -f pg.env
          echo "Connecting to $(grep '^PGHOST=' pg.list | cut -d= -f2) as $(grep '^PGUSER=' pg.list | cut -d= -f2)"
          # pg_dump must be at least as new as the database, so use the database's own version.
          v=$(docker run --rm --network host --env-file pg.list postgres:17 psql -tAc "show server_version_num" | tr -d '[:space:]')
          [ -n "$v" ] || { rm -f pg.list; echo "::error::Couldn't reach the database. Check SUPABASE_DB_URL: the Session pooler line, with the real database password."; exit 1; }
          major=$(( v / 10000 )); [ "$major" -ge 17 ] || major=17
          echo "Database version $v, using pg_dump $major"
          mkdir -p out
          docker run --rm --network host --env-file pg.list -v "$PWD/out:/out" "postgres:$major" \
            pg_dump --schema=public --no-owner --format=custom --file=/out/wishlist.dump || { rm -f pg.list; exit 1; }
          mv pg.list pg.list.keep
          echo "MAJOR=$major" >> "$GITHUB_ENV"
          # A copy that can't be read back is no copy: list its contents and count the tables.
          docker run --rm -v "$PWD/out:/out" "postgres:$major" pg_restore --list /out/wishlist.dump > out/contents.txt
          tables=$(grep -c ' TABLE DATA ' out/contents.txt || true)
          echo "Tables with data in the copy: $tables"; ls -l out/wishlist.dump
          [ "$tables" -ge 5 ] || { echo "::error::The copy looks empty ($tables tables)."; exit 1; }
          # The number of rows in every table now, to compare with the restored copy below.
          docker run --rm --network host --env-file pg.list.keep postgres:$major psql -At -c "$COUNT_SQL" > out/counts.txt
          echo "Rows per table:"; cat out/counts.txt
          # The project's address (public) for the pictures, from the user name "postgres.<project>".
          ref=$(grep '^PGUSER=' pg.list.keep | cut -d= -f2 | cut -d. -f2)
          echo "REF=$ref" >> "$GITHUB_ENV"
          docker run --rm --network host --env-file pg.list.keep postgres:$major psql -At -c \
            "select o.bucket_id || '/' || o.name from storage.objects o join storage.buckets b on b.id = o.bucket_id where b.public order by 1" > out/pictures.txt || true
          rm -f pg.list.keep
          echo "Pictures in public buckets: $(wc -l < out/pictures.txt)"
      - name: Copy the pictures
        run: |
          mkdir -p out/pictures
          n=0; bad=0
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            mkdir -p "out/pictures/$(dirname "$p")"
            if curl -sSf -m 30 -o "out/pictures/$p" "https://$REF.supabase.co/storage/v1/object/public/$p"; then n=$((n+1)); else bad=$((bad+1)); fi
          done < out/pictures.txt
          echo "Copied $n pictures, $bad failed"
          [ "$bad" -le $((n / 20 + 2)) ] || { echo "::error::Too many pictures couldn't be copied ($bad)."; exit 1; }
      - name: Restore the copy into a throw-away database and compare
        run: |
          docker run -d --name scratch -e POSTGRES_PASSWORD=scratch -p 55432:5432 "postgres:$MAJOR" > /dev/null
          for i in $(seq 1 30); do docker exec scratch pg_isready -U postgres > /dev/null 2>&1 && break; sleep 1; done
          # Supabase's own roles and extensions don't exist here; objects that need them are skipped, the data is not.
          docker exec scratch psql -U postgres -q -c "create role anon; create role authenticated; create role service_role;" > /dev/null
          docker cp out/wishlist.dump scratch:/tmp/wishlist.dump
          docker exec scratch pg_restore -U postgres -d postgres --no-owner --no-acl /tmp/wishlist.dump > restore.log 2>&1 || true
          echo "Restore messages (objects that need Supabase's extensions are expected here): $(grep -c 'error' restore.log || true)"
          docker exec scratch psql -U postgres -At -c "$COUNT_SQL" > out/restored.txt
          # The rows were counted a few seconds after the copy was made, so someone's save in between may differ
          # by a row or two: that is a warning. A missing table or a big difference fails the job.
          python3 - <<'PY'
          def read(f):
              return dict(l.rsplit(" ", 1) for l in open(f).read().split("\n") if l.strip())
          a, b = read("out/counts.txt"), read("out/restored.txt")
          bad = [t for t in a if t not in b or abs(int(a[t]) - int(b[t])) > max(2, int(a[t]) // 100)]
          small = [t for t in a if t in b and a[t] != b[t] and t not in bad]
          for t in small: print("::warning::%s: %s rows in the database, %s in the copy (a save in between)" % (t, a[t], b[t]))
          if bad:
              for t in bad: print("::error::%s: %s rows in the database, %s in the restored copy" % (t, a[t], b.get(t, "missing")))
              raise SystemExit(1)
          print("The restored copy has every table (%d) and its rows." % len(a))
          PY
          docker rm -f scratch > /dev/null
      - name: Lock the copy with the password
        env:
          PW: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          name="wishlist-$(date -u +%Y-%m-%d).tar.gpg"
          # One file: the database copy, the pictures and the row counts.
          tar -C out -cf bundle.tar wishlist.dump pictures counts.txt pictures.txt
          printf '%s' "$PW" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "$name" bundle.tar
          # Check that the password opens it again, then remove everything unlocked.
          printf '%s' "$PW" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 -d "$name" | cmp - bundle.tar
          rm -rf out bundle.tar; mkdir out; mv "$name" out/
          ls -l out/
          # A private repository has 500 MB for job files on the free plan: say so long before that is reached.
          size=$(stat -c %s "out/$name"); [ "$size" -lt 40000000 ] || echo "::warning::This copy is $((size / 1000000)) MB; 9 copies are kept. Tell Claude to keep fewer or smaller ones."
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: out/${{ env.NAME }}
          retention-days: 60
          if-no-files-found: error
