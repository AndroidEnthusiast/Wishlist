<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My wishlist, organic style</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,100&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#4F6B4A}a:hover{color:#3A5236}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: Nunito, 'Google Sans', Roboto, sans-serif; display: flex; flex-direction: column">

  <!-- soft organic shapes behind the header -->
  <div aria-hidden="true" style="position: absolute; left: -70px; top: -90px; width: 260px; height: 230px; border-radius: 58% 42% 63% 37% / 46% 58% 42% 54%; background: {{c.blobA}}"></div>
  <div aria-hidden="true" style="position: absolute; right: -60px; top: 20px; width: 170px; height: 150px; border-radius: 41% 59% 38% 62% / 55% 37% 63% 45%; background: {{c.blobB}}"></div>

  <!-- top app bar: title, search, list settings, share -->
  <div style="position: relative; display: flex; align-items: center; gap: 2px; padding: 18px 8px 4px 22px; flex: none">
    <div style="flex-grow: 1; min-width: 0">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: {{c.muted}}">7 wishes · 2 cheaper</div>
      <div style="font-family: Fraunces, Georgia, serif; font-variation-settings: 'SOFT' 100; font-size: 30px; font-weight: 600; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">My wishlist</div>
    </div>
    <button aria-label="Search" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: none; color: {{c.ink}}; display: grid; place-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg></button>
    <button aria-label="Wishlist settings" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: none; color: {{c.ink}}; display: grid; place-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
    <button aria-label="Share wishlist" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: none; color: {{c.ink}}; display: grid; place-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"></path></svg></button>
  </div>

  <!-- category, sort, and the three views -->
  <div style="position: relative; display: flex; align-items: center; gap: 8px; padding: 10px 16px 12px; flex: none">
    <button style="height: 40px; padding: 0 12px 0 16px; border: 1px solid {{c.line}}; border-radius: 20px; background: {{c.surface}}; color: {{c.ink}}; font: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 4px">All<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 10l5 5 5-5z"></path></svg></button>
    <button aria-label="Sort" style="width: 40px; height: 40px; border: 1px solid {{c.line}}; border-radius: 20px; background: {{c.surface}}; color: {{c.muted}}; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h11M4 17h6"></path></svg></button>
    <div style="flex-grow: 1"></div>
    <div role="group" aria-label="View" style="display: flex; padding: 4px; gap: 2px; border-radius: 22px; background: {{c.surface}}; border: 1px solid {{c.line}}">
      <button aria-label="Large cards" style="width: 40px; height: 32px; border: 0; border-radius: 16px; background: {{c.primary}}; color: {{c.onPrimary}}; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="3"></rect><rect x="3" y="13" width="18" height="7" rx="3"></rect></svg></button>
      <button aria-label="Two per row" style="width: 40px; height: 32px; border: 0; border-radius: 16px; background: none; color: {{c.muted}}; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="3"></rect><rect x="13" y="3" width="8" height="8" rx="3"></rect><rect x="3" y="13" width="8" height="8" rx="3"></rect><rect x="13" y="13" width="8" height="8" rx="3"></rect></svg></button>
      <button aria-label="Images only" style="width: 40px; height: 32px; border: 0; border-radius: 16px; background: none; color: {{c.muted}}; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="5.5" r="2.6"></circle><circle cx="12" cy="5.5" r="2.6"></circle><circle cx="18.5" cy="5.5" r="2.6"></circle><circle cx="5.5" cy="12" r="2.6"></circle><circle cx="12" cy="12" r="2.6"></circle><circle cx="18.5" cy="12" r="2.6"></circle><circle cx="5.5" cy="18.5" r="2.6"></circle><circle cx="12" cy="18.5" r="2.6"></circle><circle cx="18.5" cy="18.5" r="2.6"></circle></svg></button>
    </div>
  </div>

  <!-- the wishes -->
  <div style="position: relative; display: flex; flex-direction: column; gap: 14px; padding: 0 16px">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="2">
      <div style="background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: {{item.shape}}; padding: 10px; display: flex; flex-direction: column; gap: 10px">
        <div style="height: 150px; border-radius: {{item.picShape}}; background: {{item.tint}}; position: relative; display: grid; place-items: center; color: {{c.iconInk}}">
          <svg width="66" height="66" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.icon}}"></path></svg>
          <sc-if value="{{item.drop}}" hint-placeholder-val="{{true}}"><span style="position: absolute; left: 10px; top: 10px; background: {{c.drop}}; color: #FFFFFF; border-radius: 14px 14px 14px 4px; padding: 5px 11px; font-size: 12px; font-weight: 800">↓ 25% off</span></sc-if>
          <sc-if value="{{item.star}}" hint-placeholder-val="{{true}}"><span style="position: absolute; right: 10px; top: 10px; display: flex; align-items: center; gap: 4px; background: {{c.gold}}; color: #3B2A00; border-radius: 14px 14px 4px 14px; padding: 5px 10px; font-size: 12px; font-weight: 800"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"></path></svg>Most wanted</span></sc-if>
        </div>
        <div style="padding: 2px 8px 4px; display: flex; flex-direction: column; gap: 3px">
          <div style="font-size: 12px; font-weight: 700; color: {{c.muted}}">{{item.meta}}</div>
          <div style="font-size: 17px; font-weight: 700; line-height: 1.3">{{item.title}}</div>
          <sc-if value="{{item.hasNote}}" hint-placeholder-val="{{false}}"><div style="font-size: 14px; color: {{c.ink}}">Note: {{item.note}}</div></sc-if>
          <sc-if value="{{item.hasSize}}" hint-placeholder-val="{{false}}"><span style="align-self: flex-start; margin-top: 2px; background: {{c.primaryContainer}}; color: {{c.onContainer}}; border-radius: 10px; padding: 2px 10px; font-size: 12px; font-weight: 700">Size {{item.size}}</span></sc-if>
          <div style="display: flex; align-items: center; margin-top: 6px">
            <span style="font-family: Fraunces, Georgia, serif; font-variation-settings: 'SOFT' 100; font-size: 24px; font-weight: 600; color: {{item.priceColor}}; font-variant-numeric: tabular-nums">{{item.price}}</span>
            <span style="font-size: 13px; color: {{c.muted}}; text-decoration: line-through; margin-left: 8px">{{item.old}}</span>
            <span style="flex-grow: 1"></span>
            <button aria-label="Edit" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: none; color: {{c.muted}}; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
            <button aria-label="Mark as got" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: none; color: {{c.muted}}; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></button>
            <button aria-label="Delete" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: none; color: {{c.muted}}; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"></path></svg></button>
          </div>
        </div>
      </div>
    </sc-for>
  </div>

  <!-- Add wish: a pebble-shaped extended button -->
  <button style="position: absolute; right: 18px; bottom: 104px; height: 58px; padding: 0 22px 0 18px; border: 0; border-radius: 22px 30px 26px 30px; background: {{c.primary}}; color: {{c.onPrimary}}; font: inherit; font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 18px {{c.shadow}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add wish</button>

  <!-- Material 3 navigation bar: the destinations that were in the side menu -->
  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 10px 6px 14px; background: {{c.nav}}; border-top: 1px solid {{c.line}}; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{c.ink}}; font-size: 12px; font-weight: 800">
      <span style="width: 64px; height: 32px; border-radius: 16px; background: {{c.primaryContainer}}; color: {{c.onContainer}}; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"></path></svg></span>My wishlist</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{c.muted}}; font-size: 12px; font-weight: 700">
      <span style="width: 64px; height: 32px; border-radius: 16px; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 19c.6-3.3 3-5 6-5s5.4 1.7 6 5"></path><circle cx="17" cy="9" r="2.6"></circle><path d="M16.5 14.2c2.4.2 4 1.7 4.5 4.3"></path></svg></span>Shared</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{c.muted}}; font-size: 12px; font-weight: 700">
      <span style="width: 64px; height: 32px; border-radius: 16px; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="9" width="17" height="11" rx="3"></rect><path d="M12 9v11M3.5 13h17M12 9c-1.5-3.5-5.5-4-5.5-1.5S10 9 12 9zM12 9c1.5-3.5 5.5-4 5.5-1.5S14 9 12 9z"></path></svg></span>Friends</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{c.muted}}; font-size: 12px; font-weight: 700">
      <span style="width: 64px; height: 32px; border-radius: 16px; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2.2"></circle><circle cx="10" cy="17" r="2.2"></circle></svg></span>Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark","amoled"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const mode = this.props.mode ?? 'light';
const C = {
  light: { bg: '#F3EEE4', surface: '#FFFCF6', line: '#E3DBCC', ink: '#2A2B24', muted: '#66675B', primary: '#4F6B4A', onPrimary: '#FFFFFF', primaryContainer: '#D9E5CF', onContainer: '#1F3320', blobA: '#E2E8D3', blobB: '#EEDFC9', nav: '#FBF7EF', drop: '#2F7A4A', rise: '#B4432F', gold: '#E9B949', iconInk: '#3F4A39', shadow: 'rgba(60,70,40,.28)', tints: ['#E5ECDB', '#F2E5D3', '#E9E2EF'] },
  dark: { bg: '#191A15', surface: '#23251E', line: '#34372C', ink: '#ECE7DB', muted: '#B2AD9E', primary: '#A9C59E', onPrimary: '#1A2A17', primaryContainer: '#38492F', onContainer: '#D9E8CC', blobA: '#22291D', blobB: '#2A251C', nav: '#1E201A', drop: '#4FA36C', rise: '#E07A63', gold: '#E9B949', iconInk: '#D7DCCB', shadow: 'rgba(0,0,0,.45)', tints: ['#2D3526', '#352E24', '#2F2B35'] },
  amoled: { bg: '#000000', surface: '#0C0D0A', line: '#26281F', ink: '#ECE7DB', muted: '#ABA697', primary: '#A9C59E', onPrimary: '#1A2A17', primaryContainer: '#2C3A25', onContainer: '#D9E8CC', blobA: '#0F140C', blobB: '#14110C', nav: '#000000', drop: '#4FA36C', rise: '#E07A63', gold: '#E9B949', iconInk: '#D7DCCB', shadow: 'rgba(0,0,0,.6)', tints: ['#161B12', '#1C1812', '#19161D'] }
}[mode] || {};
const items = [
  { meta: 'coolblue.nl · Tech', title: 'Wireless noise-cancelling headphones', price: '€149.00', old: '€199.00', drop: true, star: true, hasNote: false, note: '', hasSize: false, size: '', shape: '30px 30px 30px 12px', picShape: '24px 24px 24px 8px', tint: C.tints[0], priceColor: C.drop, icon: 'M4 15v-3a8 8 0 0 1 16 0v3 M3 14h4v6H3z M17 14h4v6h-4z' },
  { meta: 'bol.com · Clothes', title: 'Organic cotton hoodie', price: '€59.95', old: '', drop: false, star: false, hasNote: true, note: 'Dark green if they have it.', hasSize: true, size: 'M', shape: '30px 12px 30px 30px', picShape: '24px 8px 24px 24px', tint: C.tints[1], priceColor: C.ink, icon: 'M8 3L3 6l2 4 2-1v12h10V9l2 1 2-4-5-3a4 4 0 0 1-8 0z' }
];
return { c: C, items };
}
}
</script>
</body>
</html>
