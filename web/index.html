<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- Only scripts, pictures and connections listed here can run or load: a safety net if a bug ever lets someone's text in as code. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https: http: data: blob:; connect-src https://aspnmvmsvwbezdltykgx.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<script src="theme.js?v=dev"></script>
<meta name="robots" content="noindex, nofollow">
<title>Wishlist</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="description" content="Open the list and tap Reserve on a gift so nobody gives the same gift twice.">
<meta property="og:type" content="website">
<meta property="og:title" content="Check out my wishes 🎁">
<meta property="og:description" content="Open the list and tap Reserve on a gift so nobody gives the same gift twice.">
<meta property="og:image" content="https://androidenthusiast.github.io/Wishlist/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Check out my wishes 🎁">
<meta name="twitter:description" content="Open the list and tap Reserve on a gift so nobody gives the same gift twice.">
<meta name="twitter:image" content="https://androidenthusiast.github.io/Wishlist/og.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="wishlist.css?v=dev">
<!-- The same building blocks as the browser editor (top bar, drop-down, sort button, cards), so both look like the app. -->
<link rel="stylesheet" href="edit.css?v=dev">
</head>
<body>
<header class="topbar friends">
  <h1 id="name">Wishlist</h1>
</header>
<main>
  <div class="cover" id="cover" hidden><img id="coverImg" alt=""><span id="coverText"></span></div>
  <p class="owner" id="owner" hidden></p>
  <p class="occasion" id="occasion" hidden></p>
  <p class="owner" id="sizes" hidden></p>
  <p class="sub" id="sub" hidden></p>
  <p class="about" id="about" hidden></p>
  <p class="tip" id="gone" role="status" hidden></p>
  <div class="bar" id="bar" hidden>
    <div class="pick">
      <div id="chips" class="menuwrap" hidden>
        <button type="button" class="catbtn" id="catBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Choose category">
          <span id="catName">All</span>
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
        </button>
      </div>
      <button type="button" class="vbtn" id="filterBtn" title="Sort and filter" aria-label="Sort and filter" aria-expanded="false" aria-controls="tools">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M4 12h11M4 17h6"/></svg>
        <span class="dot" id="filterDot" hidden></span>
      </button>
    </div>
    <div id="views" class="views" role="group" aria-label="View"></div>
  </div>
  <div class="tools" id="tools" hidden>
    <label class="fld"><span>Sort</span>
      <select id="sort">
        <option value="star">Top wishes first</option>
        <option value="asis">As listed</option>
        <option value="low">Price: low to high</option>
        <option value="high">Price: high to low</option>
      </select>
    </label>
    <label class="fld"><span>Max price</span>
      <input id="maxp" type="number" inputmode="decimal" min="0" step="any" placeholder="No limit">
    </label>
    <label class="chk"><input id="avail" type="checkbox"> Only gifts still available</label>
    <button type="button" class="act outline" id="clearF">Clear filters</button>
  </div>
  <div id="view"><div class="center">Loading…</div></div>
  <p class="note" id="note" hidden>Reserve what you’ll buy, so nobody gives it twice. The owner can’t see it.</p>
</main>
<div id="toast" role="status"></div>
<div id="langs"></div>

<script src="i18n.js?v=dev"></script>
<script src="occasion.js?v=dev"></script>
<script src="reserve.js?v=dev"></script>
<script src="together.js?v=dev"></script>
<script src="friends.js?v=dev"></script>
</body>
</html>
