<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>
// Light or dark as chosen with the switch at the bottom (this browser only); otherwise the device decides.
try { var wlt = localStorage.getItem("wl_theme"); if (wlt === "light" || wlt === "dark") document.documentElement.setAttribute("data-theme", wlt); } catch (e) { }
</script>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wishlist">
<title>Wishlist</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="wishlist.css">
<link rel="stylesheet" href="edit.css">
</head>
<body>
<!-- Laid out like the app's main screen: top bar, category / sort / view row, the wishes, the Add wish button and a side menu. -->
<div id="page">
<header id="head" class="topbar" hidden>
  <span class="menuslot"></span>
  <h1 id="name">Wishlist</h1>
  <button type="button" class="ibtn" id="searchBtn" aria-label="Search" title="Search">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
  </button>
  <button type="button" class="ibtn" id="listBtn" aria-label="Wishlist settings" title="Wishlist settings" aria-haspopup="menu" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
  </button>
  <button type="button" class="ibtn" id="shareBtn" aria-label="Invite or share" title="Invite or share">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
  </button>
</header>
<main>
  <p class="tip" id="tip" hidden></p>
  <div id="toolbar" hidden>
    <div class="searchbar" id="searchbar" hidden>
      <input id="search" type="search" placeholder="Search wishes" aria-label="Search wishes" autocomplete="off">
      <button type="button" class="ibtn" id="searchClose" aria-label="Close search" title="Close search">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <div class="bar">
      <div class="pick">
        <div class="menuwrap">
          <button type="button" class="catbtn" id="catBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Choose category">
            <span id="catName">All</span>
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
          </button>
        </div>
        <div class="menuwrap">
          <button type="button" class="sortbtn" id="sortBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Sort" title="Sort">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M4 12h11M4 17h6"/></svg>
            <span id="sortName"></span>
          </button>
        </div>
      </div>
      <div id="views" class="views" role="group" aria-label="View"></div>
    </div>
  </div>
  <div id="view"><div class="center">Loading…</div></div>
</main>
<button type="button" class="fab" id="fab" hidden>
  <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
  <span>Add wish</span>
</button>
</div>
<div id="scrim" class="scrim"></div>
<nav id="drawer" class="drawer" aria-label="Menu">
  <div class="dhead" id="dname">Wishlist</div>
  <p class="dsub" id="who"></p>
  <p class="about" id="about" hidden></p>
  <button type="button" class="ditem" id="meBtn">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    <span>Settings</span>
  </button>
  <p class="note" id="note">Tap Reserve on a gift you plan to buy. Everyone on this list sees what’s reserved, so nobody buys the same gift twice.</p>
</nav>
<button type="button" class="menubtn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="drawer" hidden><span class="burger" aria-hidden="true"><i></i><i></i><i></i></span></button>
<div id="snack" role="status" hidden></div>
<div id="toast" role="status"></div>
<script src="nl.js"></script>
<script src="i18n.js"></script>
<script src="parse.js"></script>
<script src="edit.js"></script>
</body>
</html>
